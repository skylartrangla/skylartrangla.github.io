<style>
:root{--red:#d71920;--bg:#f4f6fa;--card:#fff;--text:#182033;--line:#d9dee8;--good:#16763c;--bad:#ba2d2d}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--line);padding:12px}
.header{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:18px;margin:0}.muted{font-size:13px;color:#687084}.bar{max-width:900px;margin:9px auto 0;height:8px;background:#e8ebf1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--red);width:0}
main{max-width:900px;margin:16px auto 90px;padding:0 12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;font-size:14px}.primary{background:var(--red);color:#fff}.secondary{background:#e7ebf2;color:#20283a}
.section{font-weight:900;margin:24px 3px 8px;color:#454e61}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0}
.num{font-size:12px;color:var(--red);font-weight:900}.q{font-size:17px;font-weight:750;line-height:1.42;margin:5px 0 12px}
.option{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.option input{margin-top:3px;transform:scale(1.15)}
.option.correct{background:#eef9f1;border-color:#86c69b}.option.wrong{background:#fff0f0;border-color:#e6a0a0}
.exp{display:none;margin-top:10px;padding:10px 12px;border-radius:9px;background:#f1f3f7;border-left:4px solid #929aad;line-height:1.45}.exp.show{display:block}
.score{display:none;background:#111827;color:#fff;border-radius:14px;padding:18px;margin:12px 0}.score.show{display:block}.big{font-size:32px;font-weight:900}
select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}
@media(max-width:600px){.q{font-size:16px}h1{font-size:16px}button{font-size:13px;padding:9px 10px}}
</style>

<script>
const qs=[{"n":1,"q":"Trong Unreal Engine, Yaw biểu diễn điều gì?","opts":["Quay quanh trục X, làm object nghiêng sang hai bên","Quay quanh trục Y, làm object nhìn lên hoặc xuống","Quay quanh trục Z, làm object đổi hướng trái hoặc phải","Di chuyển quanh trục Z mà không thay đổi rotation"],"a":2,"exp":"Yaw là rotation quanh trục Z trong Unreal Engine, làm actor đổi hướng trái/phải."},{"n":2,"q":"Một Actor có World Rotation Yaw = 90°. Ý nghĩa đúng nhất là:","opts":["Actor đã xoay 90° quanh trục thẳng đứng của hệ tọa độ UE","Actor đã xoay 90° quanh trục ngang X","Actor đã di chuyển 90 cm theo Z","Actor đã thay đổi FOV 90°"],"a":0,"exp":"Yaw quay quanh trục Z, nên World Yaw = 90° là xoay 90° quanh trục thẳng đứng của world."},{"n":3,"q":"Local Space khác World Space chủ yếu ở điểm nào?","opts":["Local Space luôn tính theo camera, World Space theo màn hình","Local Space dùng hệ trục của object/parent; World Space dùng hệ trục chung của scene","Local Space chỉ dùng cho animation; World Space chỉ dùng modeling","Local Space không có rotation"],"a":1,"exp":"Local Space dùng hệ trục riêng hoặc tương đối với parent; World Space dùng hệ trục chung của toàn scene."},{"n":4,"q":"Một object là child của object khác. Khi parent quay, child thường:","opts":["Không thay đổi nếu child có material riêng","Kế thừa transform của parent theo hierarchy","Chỉ đổi scale, không đổi vị trí","Chỉ đổi vị trí nếu có physics"],"a":1,"exp":"Child kế thừa transform của parent theo hierarchy, nên parent quay thì child thay đổi theo."},{"n":5,"q":"Viewport hiển thị GPU Time 18 ms, Game Thread 5 ms, Draw Thread 7 ms. Thành phần nào đang giới hạn FPS nhiều nhất?","opts":["Game Thread","Draw Thread","CPU tổng thể vì 5 + 7 = 12 ms","GPU"],"a":3,"exp":"Thành phần có frame time lớn nhất thường là bottleneck. GPU 18 ms lớn nhất."},{"n":6,"q":"60 FPS có nghĩa chính xác nhất là:","opts":["GPU xử lý đúng 60 polygon mỗi giây","Hệ thống hiển thị khoảng 60 khung hình hoàn chỉnh mỗi giây","Mỗi frame mất 60 ms","Màn hình bắt buộc có tần số quét 60 Hz"],"a":1,"exp":"FPS = Frames Per Second. 60 FPS nghĩa là khoảng 60 khung hình mỗi giây."},{"n":7,"q":"Frame time lý tưởng tương ứng với 60 FPS xấp xỉ:","opts":["8,33 ms","16,67 ms","33,33 ms","60 ms"],"a":1,"exp":"1000 / 60 ≈ 16,67 ms mỗi frame."},{"n":8,"q":"Một scene đang chạy 60 FPS. Nếu frame time tăng từ 16,7 ms lên 33,3 ms thì FPS gần nhất là:","opts":["15 FPS","24 FPS","30 FPS","120 FPS"],"a":2,"exp":"1000 / 33,3 ≈ 30 FPS."},{"n":9,"q":"Trong workflow PBR Metal/Roughness, Roughness = 0 thường biểu thị:","opts":["Bề mặt cực nhám, reflection rất mờ","Bề mặt cực mịn, reflection sắc","Vật liệu chắc chắn là kim loại","Bề mặt không phản xạ ánh sáng"],"a":1,"exp":"Roughness thấp nghĩa là bề mặt vi mô mịn hơn, highlight hẹp và reflection sắc hơn."},{"n":10,"q":"Roughness khác Metallic ở điểm cốt lõi nào?","opts":["Roughness quyết định object có transparent hay không; Metallic quyết định opacity","Roughness kiểm soát độ sắc/mờ của reflection; Metallic xác định hành vi vật liệu kim loại hay phi kim","Roughness chỉ dùng với Landscape; Metallic chỉ dùng với Skeletal Mesh","Hai giá trị có cùng tác dụng nhưng đơn vị khác nhau"],"a":1,"exp":"Roughness mô tả độ nhám bề mặt; Metallic phân loại vật liệu theo hành vi kim loại/phi kim."},{"n":11,"q":"Trong Landscape Material, Layer Blend đã có tên Soil nhưng Landscape Paint không paint đúng. Thành phần thường còn thiếu là:","opts":["Material Parameter Collection","Layer Info","Post Process Material","Physical Animation Component"],"a":1,"exp":"Landscape Paint thường cần Layer Info tương ứng với layer trong Landscape Material."},{"n":12,"q":"Layer Info trong Landscape chủ yếu lưu:","opts":["Dữ liệu weight hoặc thông tin paint tương ứng với Landscape Layer","Dữ liệu ánh sáng baked","Camera transform","LOD mesh của landscape"],"a":0,"exp":"Layer Info lưu dữ liệu paint/weight của Landscape Layer."},{"n":13,"q":"Virtual Texturing mang lại lợi ích chính nào cho landscape/môi trường lớn?","opts":["Luôn giữ toàn bộ texture 8K trong VRAM","Stream các page/tile cần thiết thay vì phải giữ toàn bộ texture độ phân giải cao","Chuyển texture raster thành vector","Tự giảm polygon của landscape"],"a":1,"exp":"Virtual Texturing chia texture thành page/tile và chỉ stream phần cần thiết."},{"n":14,"q":"Điểm khác cơ bản giữa Virtual Texturing và Mipmap là:","opts":["Mipmap chia texture thành tile; Virtual Texturing chỉ giảm resolution","Mipmap tạo các phiên bản resolution khác nhau; Virtual Texturing còn có thể stream theo page/tile không gian","Cả hai hoàn toàn giống nhau","Virtual Texturing chỉ dành cho normal map"],"a":1,"exp":"Mipmap là chuỗi resolution giảm dần; Virtual Texturing còn chia dữ liệu theo page/tile để stream từng vùng."},{"n":15,"q":"Lumen và Virtual Shadow Maps khác nhau cơ bản thế nào?","opts":["Lumen xử lý GI/reflection; VSM xử lý shadow","Lumen xử lý shadow; VSM xử lý GI","Lumen và VSM đều chỉ xử lý reflection","Lumen và VSM đều chỉ hoạt động với Static Light"],"a":0,"exp":"Lumen xử lý Global Illumination/reflection; Virtual Shadow Maps xử lý shadow."},{"n":16,"q":"Nếu scene dùng Lumen, nhận định nào đúng nhất?","opts":["Lumen loại bỏ hoàn toàn nhu cầu có light source","Lumen hỗ trợ GI/reflection động nhưng vẫn cần các nguồn sáng để tạo illumination","Lumen chỉ là anti-aliasing","Lumen chỉ hoạt động với Lightmap đã bake"],"a":1,"exp":"Lumen không thay thế nguồn sáng. Nó tính GI/reflection dựa trên lighting trong scene."},{"n":17,"q":"Lệnh foliage.CullDistanceScale 2 thường:","opts":["Nhân khoảng cách cull foliage đã cấu hình lên 2","Giảm một nửa kích thước foliage","Chỉ thay Start Cull Distance, không đổi End","Chuyển toàn bộ foliage thành Nanite"],"a":0,"exp":"CullDistanceScale nhân hệ số vào khoảng cách cull đã cấu hình."},{"n":18,"q":"Giảm foliage.MinimumScreenSize thường:","opts":["Làm foliage biến mất sớm hơn","Cho phép foliage có kích thước hiển thị trên màn hình nhỏ hơn vẫn tiếp tục được render","Làm mesh thật nhỏ hơn trong world","Giảm texture resolution"],"a":1,"exp":"Ngưỡng nhỏ hơn làm instance rất nhỏ trên màn hình vẫn còn được render lâu hơn."},{"n":19,"q":"Nếu End Cull Distance = 0 và thuộc tính đó quy ước 0 là disabled, kết quả đúng là:","opts":["Object bị cull ngay ở camera","Object chỉ được render đúng tại khoảng cách 0","Distance culling bởi giá trị này bị vô hiệu hóa","Engine tự đặt 10.000 cm"],"a":2,"exp":"Theo quy ước của câu hỏi, 0 nghĩa là tắt giới hạn distance culling từ tham số này."},{"n":20,"q":"Trong foliage/instance, Start Cull Distance và End Cull Distance thường có nghĩa:","opts":["Start = bắt đầu fade/cull; End = cull hoàn toàn","Start = cull hoàn toàn; End = bắt đầu fade","Start = đổi mipmap; End = đổi LOD","Start chỉ dùng Nanite; End chỉ dùng non-Nanite"],"a":0,"exp":"Start là lúc bắt đầu fade/cull; End là lúc instance bị loại hoàn toàn."},{"n":21,"q":"LOD0, LOD1, LOD2 thường có quan hệ nào?","opts":["LOD0 chi tiết thấp nhất, LOD2 cao nhất","LOD0 thường chi tiết cao nhất, các LOD sau đơn giản dần","Tất cả có cùng polygon, chỉ khác texture","LOD chỉ thay đổi material"],"a":1,"exp":"LOD0 thường chi tiết nhất, LOD1/LOD2 giảm dần geometry complexity."},{"n":22,"q":"Điểm cốt lõi khiến LOD giúp tăng performance là:","opts":["Vật ở xa không cần geometry chi tiết như vật ở gần","Vật ở xa luôn có nhiều pixel hơn","LOD tăng texture resolution ở khoảng cách xa","LOD làm shader phức tạp hơn"],"a":0,"exp":"Vật ở xa chiếm ít pixel nên mesh chi tiết cao là lãng phí."},{"n":23,"q":"Một mip chain bắt đầu ở texture 1024×1024. Thứ tự hợp lý là:","opts":["1024 → 512 → 256 → 128 → ...","1024 → 2048 → 4096 → ...","512 → 1024 → 256 → ...","1024 → 1000 → 900 → ..."],"a":0,"exp":"Mip level thường giảm một nửa kích thước mỗi chiều."},{"n":24,"q":"Mipmap được chọn chủ yếu dựa trên:","opts":["Khoảng cách/footprint của texture trên màn hình","Số bone của Skeletal Mesh","Collision preset","Audio sample rate"],"a":0,"exp":"Renderer chọn mip theo footprint/sampling của texture trên màn hình."},{"n":25,"q":"Nếu một texture 4096×4096 được hiển thị rất nhỏ ở xa nhưng vẫn sample full 4K liên tục, vấn đề chính là:","opts":["Lãng phí bandwidth/cache và dễ aliasing","Tăng độ chính xác physics","Tăng số vertex","Tăng frame rate"],"a":0,"exp":"Mipmap giúp tránh lãng phí bandwidth/cache và giảm aliasing khi texture xuất hiện nhỏ."},{"n":26,"q":"Nanite giải quyết tốt nhất vấn đề nào?","opts":["Quản lý hình học rất chi tiết bằng virtualized geometry","Audio spatialization","Transparent particle sorting","UI scaling"],"a":0,"exp":"Nanite là hệ thống virtualized geometry cho mesh rất chi tiết."},{"n":27,"q":"Nanite không trực tiếp giải quyết:","opts":["Geometry complexity","Chi tiết mesh ở nhiều khoảng cách","Material shader quá phức tạp và overdraw transparency","Streaming geometry"],"a":2,"exp":"Nanite chủ yếu xử lý geometry, không tự sửa shader complexity hay transparency overdraw."},{"n":28,"q":"Grass chỉ xuất hiện khi camera zoom gần dù PCG points đã được sinh. Thông số nên kiểm tra trước là:","opts":["Screen-size culling, cull distance và bounds","Exposure compensation","Collision channel của Landscape","Manual Focus Distance"],"a":0,"exp":"Nếu points đã có nhưng mesh chỉ hiện khi gần, culling/bounds là nghi phạm đầu tiên."},{"n":29,"q":"PCG khác Foliage Paint chủ yếu ở:","opts":["PCG thiên về sinh nội dung theo rule/data; Foliage Paint thiên về rải thủ công","PCG chỉ dùng skeletal mesh","Foliage Paint không hỗ trợ instance","Hai hệ thống hoàn toàn giống nhau"],"a":0,"exp":"PCG là rule/data driven; Foliage Paint chủ yếu là workflow brush/manual."},{"n":30,"q":"PCG Volume chủ yếu dùng để:","opts":["Xác định vùng mà PCG graph xử lý/sinh nội dung","Xác định exposure volume","Xác định camera clipping","Xác định VRAM allocation"],"a":0,"exp":"PCG Volume xác định vùng không gian/dữ liệu mà graph hoạt động trên đó."},{"n":31,"q":"Muốn grass random hướng quanh trục thẳng đứng nhưng không bị đổ nghiêng:","opts":["Random Pitch","Random Roll","Random Yaw","Random cả Pitch, Roll, Yaw"],"a":2," ne; Component bổ sung hành vi/chức năng cho GameObject","Component chứa GameObject","Hai khái niệm giống nhau","Component chỉ là material"],"a":0,"exp":"GameObject là thực thể; Component thêm chức năng như Renderer, Collider, Script..."},{"n":39,"q":"Mesh Renderer chủ yếu:","opts":["Render geometry của Mesh Filter bằng material","Lưu skeleton","Điều khiển audio","Tạo physics simulation"],"a":0,"exp":"Mesh Filter giữ mesh; Mesh Renderer hiển thị mesh với material."},{"n":40,"q":"Mesh Filter chủ yếu:","opts":["Giữ reference tới mesh geometry","Chỉ giữ material","Điều khiển camera","Chứa lightmap duy nhất"],"a":0,"exp":"Mesh Filter giữ reference đến Mesh asset/geometry."},{"n":41,"q":"Collider và Renderer khác nhau thế nào?","opts":["Collider quyết định hình ảnh; Renderer quyết định physics","Collider phục vụ collision/physics; Renderer phục vụ hiển thị","Collider chỉ dùng với UI","Chúng luôn phải có cùng geometry"],"a":1,"exp":"Collider dùng cho physics/collision; Renderer dùng để hiển thị."},{"n":42,"q":"Rigidbody chủ yếu thêm:","opts":["Khả năng tham gia physics như mass, velocity, force","Texture streaming","Reflection","Post-processing"],"a":0,"exp":"Rigidbody giúp object tham gia hệ physics."},{"n":43,"q":"Một object có Collider nhưng không có Rigidbody. Điều nào đúng nhất?","opts":["Nó vẫn có thể đóng vai trò collider tĩnh trong physics","Collider không hoạt động hoàn toàn","Nó trở thành UI element","Nó tự có gravity"],"a":0,"exp":"Collider có thể tồn tại như collider tĩnh mà không cần Rigidbody."},{"n":44,"q":"URP và HDRP khác nhau sâu hơn ở triết lý thiết kế nào?","opts":["URP tập trung scalability/đa nền tảng; HDRP tập trung high-end fidelity","URP chỉ là 2D; HDRP chỉ là 3D","URP không có lighting","HDRP không có material"],"a":0,"exp":"URP thiên về scalability/đa nền tảng; HDRP thiên về visual fidelity trên phần cứng mạnh."},{"n":45,"q":"Một studio cần build cùng project cho mobile, standalone PC và VR tương đối nhẹ. Pipeline hợp lý hơn thường là:","opts":[" exp":"Transparency thường tăng overdraw vì nhiều lớp pixel phải được blend."},{"n":60,"q":"VSync chủ yếu:","opts":["Đồng bộ việc trình frame với refresh của màn hình để giảm tearing","Tự tăng FPS vô hạn","Giảm texture memory","Tạo motion blur"],"a":0,"exp":"VSync đồng bộ frame presentation với refresh để giảm tearing."},{"n":61,"q":"RGB là mô hình màu:","opts":["Cộng ánh sáng","Trừ ánh sáng bằng mực","Chỉ dành cho in offset","Chỉ dành cho grayscale"],"a":0,"exp":"RGB là additive color model."},{"n":62,"q":"Trong mô hình RGB lý tưởng, Red + Green tạo:","opts":["Cyan","Yellow","Magenta","Black"],"a":1,"exp":"Red + Green = Yellow."},{"n":63,"q":"Trong RGB, Green + Blue tạo:","opts":["Cyan","Yellow","Magenta","White"],"a":0,"exp":"Green + Blue = Cyan."},{"n":64,"q":"Trong RGB, Red + Blue tạo:","opts":["Yellow","Cyan","Magenta","Green"],"a":2,"exp":"Red + Blue = Magenta."},{"n":65,"q":"Trong RGB, Red + Green + Blue ở cường độ tối đa tạo:","opts":["Black","Gray","White","CMYK Black"],"a":2,"exp":"RGB tối đa cộng lại thành White."},{"n":66,"q":"CMYK là mô hình màu:","opts":["Additive, thường dùng màn hình","Subtractive, thường dùng in ấn","Chỉ dùng HDR","Chỉ dùng video"],"a":1,"exp":"CMYK là subtractive color model, dùng chủ yếu trong in ấn."},{"n":67,"q":"Trong CMYK, chữ K đại diện cho:","opts":["Kelvin","Key/Black plate","Khaki","Kernel"],"a":1,"exp":"K là Key, thường là black plate/mực đen."},{"n":68,"q":"Tại sao CMYK có thêm K thay vì chỉ dùng Cyan, Magenta và Yellow để tạo đen?","opts":["Vì thực tế kết hợp CMY khó tạo màu đen sâu, ổn định và kinh tế như dùng mực đen riêng","Vì Cyan không thể in","Vì Magenta không trộn với Yellow","Vì K tạo alpha"],"a":0,"exp":"CMY thực tế khó cho đen sâu và ổn định; mực K cho đen sạch hơn và tiết kiệm mực."},{"n":69,"q":"Trong hệ màu bổ sung additive RGB, màu bổ sung của Red là:","opts":["Green","Blue","Cyan","Yellow"],"a":2,"exp":"Red bổ sung với Cyan."},{"n":70,"q":"Màu bổ sung của Blue trong mô hình RGB là:","opts":["Yellow","Magenta","Cyan","Red"],"a":0,"exp":"Blue bổ sung với Yellow."},{"n":71,"q":"Nếu thiết kế banner chỉ hiển thị trên màn hình điện thoại/web, color mode phù hợp nhất là:","opts":["CMYK","RGB","Duotone bắt buộc","Bitmap 1-bit"],"a":1,"exp":"Màn hình sử dụng RGB."},{"n":72,"q":"Nếu chuẩn bị artwork cho in offset thương mại, workflow màu thường ưu tiên:","opts":["RGB không cần chuyển đổi","CMYK/profile in phù hợp","Chỉ alpha","Chỉ Lab bắt buộc"],"a":1,"exp":"In offset thường dùng CMYK với profile in phù hợp."},{"n":73,"q":"Raster image khác vector ở điểm nào?","opts":["Raster dựa trên pixel; vector dựa trên path/hình học toán học","Raster scale vô hạn không mất nét","Vector luôn là ảnh chụp","Raster không có resolution"],"a":0,"exp":"Raster = pixel; vector = path/shape toán học."},{"n":74,"q":"Một logo cần phóng từ 5 cm lên biển quảng cáo 5 m mà vẫn sắc. Định dạng/loại dữ liệu phù hợp nhất:","opts":["JPEG 640×480","Vector","PNG 256×256","GIF"],"a":1,"exp":"Vector phù hợp vì scale lớn không phụ thuộc pixel resolution."},{"n":75,"q":"Trong thiết kế thị giác, contrast có tác dụng cốt lõi:","opts":["Làm mọi yếu tố giống nhau","Tạo khác biệt để tăng phân cấp và nhấn mạnh","Luôn làm màu tối hơn","Chỉ áp dụng cho typography"],"a":1,"exp":"Contrast tạo khác biệt để tăng emphasis, hierarchy và readability."}],letters=["A","B","C","D"];
let showAll=false;
function section(n){if(n===1)return"PHẦN A • UNREAL ENGINE";if(n===36)return"PHẦN B • UNITY";if(n===61)return"PHẦN C • 2D, MÀU SẮC, HÌNH ẢNH";return null}
function render(){const quiz=document.getElementById("quiz"),jump=document.getElementById("jump");quiz.innerHTML="";jump.innerHTML="";qs.forEach(x=>{const s=section(x.n);if(s){let d=document.createElement("div");d.className="section";d.textContent=s;quiz.appendChild(d)}let c=document.createElement("div");c.className="card";c.id="q"+x.n;c.innerHTML=`<div class="num">Câu ${x.n}</div><div class="q">${x.q}</div>`+x.opts.map((o,i)=>`<label class="option" data-q="${x.n}" data-i="${i}"><input type="radio" name="q${x.n}" value="${i}" onchange="save(${x.n},${i})"><span><b>${letters[i]}.</b> ${o}</span></label>`).join("")+`<div class="exp" id="e${x.n}"><b>Giải thích:</b> ${x.exp}</div>`;quiz.appendChild(c);let op=document.createElement("option");op.value=x.n;op.textContent="Câu "+x.n;jump.appendChild(op)});restore();progress()}
function save(n,i){localStorage.setItem("vt75_"+n,i);progress()}
function restore(){qs.forEach(x=>{let v=localStorage.getItem("vt75_"+x.n);if(v!==null){let r=document.querySelector(`input[name=q${x.n}][value="${v}"]`);if(r)r.checked=true}})}
function progress(){let n=qs.filter(x=>document.querySelector(`input[name=q${x.n}]:checked`)).length;document.getElementById("status").textContent=`${n}/75 câu đã trả lời`;document.getElementById("fill").style.width=(n/75*100)+"%"}
function grade(){let score=0,wrong=[];qs.forEach(x=>{let sel=document.querySelector(`input[name=q${x.n}]:checked`),labs=[...document.querySelectorAll(`.option[data-q="${x.n}"]`)];labs.forEach(l=>l.classList.remove("correct","wrong"));labs[x.a].classList.add("correct");if(sel){let i=+sel.value;if(i===x.a)score++;else{labs[i].classList.add("wrong");wrong.push(x.n)}}else wrong.push(x.n);document.getElementById("e"+x.n).classList.add("show")});let pct=Math.round(score/75*100),box=document.getElementById("score");box.classList.add("show");box.innerHTML=`<div class="big">${score}/75 • ${pct}%</div><div style="margin-top:8px">Sai/chưa trả lời: ${wrong.length?wrong.join(", "):"Không có 🎯"}</div>`;window.scrollTo({top:0,behavior:"smooth"})}
function toggleExp(){showAll=!showAll;document.querySelectorAll(".exp").forEach(e=>e.classList.toggle("show",showAll))}
function resetQuiz(){if(!confirm("Xóa toàn bộ câu trả lời và làm lại?"))return;qs.forEach(x=>localStorage.removeItem("vt75_"+x.n));document.getElementById("score").classList.remove("show");render()}
function jumpQ(){document.getElementById("q"+document.getElementById("jump").value).scrollIntoView({behavior:"smooth",block:"start"})}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
